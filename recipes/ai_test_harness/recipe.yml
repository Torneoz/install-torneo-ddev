name: 'AI module test harness'
description: 'Installs Drupal AI, costs, observability, CKEditor integration, OpenAI, Anthropic and Grok providers, AI Image Studio, and AI Media Image.'
type: recipe

install:
  - torneo_ai_harness
  - ai
  - ai_costs
  - ai_metering
  - ai_budget_control
  - ai_observability
  - ai_ckeditor
  - ai_agents
  - canvas_ai
  - ai_assistant_api
  - ai_chatbot
  - ai_dashboard
  - ai_api_explorer
  - mcp_server
  - tool
  - mcp_server_tool_bridge
  - ai_provider_openai
  - ai_provider_anthropic
  - grok
  - grok_doc
  - gemini_provider
  - ai_image_alt_text
  - ai_image_bulk_alt_text
  - ai_image_studio
  - ai_narration
  - views_bulk_operations
  - ai_image_studio_vbo
  - ai_storyboard
  - ai_media_image

config:
  import:
    ai_storyboard: '*'
  actions:
    ai_provider_openai.settings:
      simpleConfigUpdate:
        api_key: openai_api_key
    ai_provider_anthropic.settings:
      simpleConfigUpdate:
        api_key: anthropic_api_key
    grok.settings:
      simpleConfigUpdate:
        api_key: xai_api_key
    gemini_provider.settings:
      simpleConfigUpdate:
        api_key: google_gemini_api_key
    system.site:
      simpleConfigUpdate:
        name: 'Torneo AI'
        page.front: /home
    user.role.anonymous:
      grantPermissions:
        - 'access deepchat api'
    user.role.authenticated:
      grantPermissions:
        - 'access deepchat api'
