name: 'AI module test harness'
description: 'Installs Drupal AI, costs, observability, CKEditor integration, OpenAI and Grok providers, AI Image Studio, and AI Media Image.'
type: recipe

install:
  - ai
  - ai_costs
  - ai_observability
  - ai_ckeditor
  - ai_agents
  - ai_assistant_api
  - ai_chatbot
  - ai_dashboard
  - ai_api_explorer
  - ai_provider_openai
  - grok
  - ai_image_alt_text
  - ai_image_bulk_alt_text
  - ai_image_studio
  - ai_media_image

config:
  actions:
    ai_provider_openai.settings:
      simpleConfigUpdate:
        api_key: openai_api_key
    grok.settings:
      simpleConfigUpdate:
        api_key: xai_api_key
    user.role.anonymous:
      grantPermissions:
        - 'access deepchat api'
    user.role.authenticated:
      grantPermissions:
        - 'access deepchat api'
